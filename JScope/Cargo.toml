[package]
name = "jscope"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = "0.35"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
webrtc = "0.17.2"
bytes = "1"
cpal = "0.17.3"
ropus = "0.12.18"
livekit = "0.7.53"

[profile.release]
lto = "thin"
strip = true
