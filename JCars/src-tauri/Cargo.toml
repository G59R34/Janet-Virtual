[package]
name = "jcars"
version = "0.3.1"
description = "Lightweight JANET Virtual Airlines ACARS client"
authors = ["JANET Virtual Airlines"]
edition = "2021"

[lib]
name = "jcars_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simconnect-sdk = { version = "0.2.3", features = ["derive"] }
